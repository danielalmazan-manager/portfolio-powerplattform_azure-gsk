<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00BCF2;stop-opacity:0.06"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#742774"/>
      <stop offset="100%" style="stop-color:#0078D4"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <filter id="shadowSm" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" rx="12" fill="#FAFBFC"/>
  
  <!-- Title Bar -->
  <rect x="0" y="0" width="1100" height="56" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="24" width="1100" height="32" fill="url(#headerGrad)"/>
  <text x="550" y="36" text-anchor="middle" fill="white" font-size="18" font-weight="600">System Architecture — Enterprise Mobile Device Management Platform</text>

  <!-- ===== LAYER 1: END USERS ===== -->
  <rect x="40" y="76" width="1020" height="72" rx="10" fill="white" stroke="#E1E4E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="100" text-anchor="middle" fill="#24292F" font-size="13" font-weight="700" letter-spacing="1.5">END USERS</text>
  <g transform="translate(160, 108)">
    <rect width="120" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="60" y="18" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="500">IT Analysts</text>
  </g>
  <g transform="translate(310, 108)">
    <rect width="120" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="60" y="18" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="500">Managers</text>
  </g>
  <g transform="translate(460, 108)">
    <rect width="160" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="80" y="18" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="500">Field Coordinators</text>
  </g>
  <g transform="translate(650, 108)">
    <rect width="160" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="80" y="18" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="500">IT Administrators</text>
  </g>

  <!-- Arrow down -->
  <line x1="550" y1="148" x2="550" y2="170" stroke="#742774" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <defs>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#742774"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0078D4"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- HTTPS label -->
  <rect x="520" y="150" width="60" height="18" rx="9" fill="#742774"/>
  <text x="550" y="163" text-anchor="middle" fill="white" font-size="9" font-weight="600">HTTPS</text>

  <!-- ===== LAYER 2: POWER APPS ===== -->
  <rect x="40" y="180" width="1020" height="120" rx="10" fill="white" stroke="#742774" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="40" y="180" width="1020" height="32" rx="10" fill="#742774"/>
  <rect x="40" y="200" width="1020" height="12" fill="#742774"/>
  <!-- Power Apps icon placeholder -->
  <text x="60" y="200" fill="white" font-size="14">⚡</text>
  <text x="80" y="201" fill="white" font-size="13" font-weight="600">Microsoft Power Apps — Canvas Application</text>

  <!-- Module boxes -->
  <g transform="translate(65, 224)">
    <rect width="220" height="60" rx="8" fill="#F5F0F5" stroke="#D4A5D4" stroke-width="1" filter="url(#shadowSm)"/>
    <text x="110" y="22" text-anchor="middle" fill="#742774" font-size="11" font-weight="700">📋 Device Catalog</text>
    <text x="110" y="40" text-anchor="middle" fill="#6B7280" font-size="10">CRUD · Search · Filter</text>
    <text x="110" y="52" text-anchor="middle" fill="#6B7280" font-size="10">Bulk Import</text>
  </g>
  <g transform="translate(305, 224)">
    <rect width="220" height="60" rx="8" fill="#F5F0F5" stroke="#D4A5D4" stroke-width="1" filter="url(#shadowSm)"/>
    <text x="110" y="22" text-anchor="middle" fill="#742774" font-size="11" font-weight="700">👤 User Catalog</text>
    <text x="110" y="40" text-anchor="middle" fill="#6B7280" font-size="10">Employee Registry</text>
    <text x="110" y="52" text-anchor="middle" fill="#6B7280" font-size="10">Org Hierarchy</text>
  </g>
  <g transform="translate(545, 224)">
    <rect width="220" height="60" rx="8" fill="#F5F0F5" stroke="#D4A5D4" stroke-width="1" filter="url(#shadowSm)"/>
    <text x="110" y="22" text-anchor="middle" fill="#742774" font-size="11" font-weight="700">🔗 Assignment Module</text>
    <text x="110" y="40" text-anchor="middle" fill="#6B7280" font-size="10">Assign · Return · Transfer</text>
    <text x="110" y="52" text-anchor="middle" fill="#6B7280" font-size="10">Signature Tracking</text>
  </g>
  <g transform="translate(785, 224)">
    <rect width="240" height="60" rx="8" fill="#F5F0F5" stroke="#D4A5D4" stroke-width="1" filter="url(#shadowSm)"/>
    <text x="120" y="22" text-anchor="middle" fill="#742774" font-size="11" font-weight="700">🚨 Incident Reporting</text>
    <text x="120" y="40" text-anchor="middle" fill="#6B7280" font-size="10">Theft · Loss · Damage</text>
    <text x="120" y="52" text-anchor="middle" fill="#6B7280" font-size="10">Repair · Support · Stock</text>
  </g>

  <!-- Arrows from Power Apps to Power Automate -->
  <line x1="550" y1="300" x2="550" y2="330" stroke="#0066FF" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== LAYER 3: POWER AUTOMATE ===== -->
  <rect x="40" y="340" width="1020" height="110" rx="10" fill="white" stroke="#0066FF" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="40" y="340" width="1020" height="32" rx="10" fill="#0066FF"/>
  <rect x="40" y="360" width="1020" height="12" fill="#0066FF"/>
  <text x="60" y="361" fill="white" font-size="14">⚙️</text>
  <text x="82" y="361" fill="white" font-size="13" font-weight="600">Microsoft Power Automate — Integration &amp; Automation Layer</text>

  <g transform="translate(65, 385)">
    <rect width="300" height="50" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" filter="url(#shadowSm)"/>
    <text x="150" y="20" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="700">✍️ Digital Signature Flow</text>
    <text x="150" y="36" text-anchor="middle" fill="#6B7280" font-size="10">Generate PDF → Adobe Sign → Store Signed Doc</text>
  </g>
  <g transform="translate(390, 385)">
    <rect width="280" height="50" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" filter="url(#shadowSm)"/>
    <text x="140" y="20" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="700">💾 Auto-Save &amp; Sync Flow</text>
    <text x="140" y="36" text-anchor="middle" fill="#6B7280" font-size="10">Scheduled Sync · Conflict Resolution</text>
  </g>
  <g transform="translate(695, 385)">
    <rect width="340" height="50" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" filter="url(#shadowSm)"/>
    <text x="170" y="20" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="700">🔔 Notification &amp; Status Flows</text>
    <text x="170" y="36" text-anchor="middle" fill="#6B7280" font-size="10">Email · Teams · Device Status Updates</text>
  </g>

  <!-- Arrows down from Power Automate to data layer -->
  <line x1="200" y1="450" x2="200" y2="490" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="550" y1="450" x2="550" y2="490" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="880" y1="450" x2="880" y2="490" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ===== LAYER 4: DATA & SERVICES ===== -->
  <!-- Adobe Sign -->
  <rect x="40" y="500" width="280" height="110" rx="10" fill="white" stroke="#EC1C24" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="40" y="500" width="280" height="30" rx="10" fill="#EC1C24"/>
  <rect x="40" y="520" width="280" height="10" fill="#EC1C24"/>
  <text x="180" y="520" text-anchor="middle" fill="white" font-size="12" font-weight="600">Adobe Sign API</text>
  <text x="180" y="550" text-anchor="middle" fill="#24292F" font-size="10">Send Responsibility Letter</text>
  <text x="180" y="566" text-anchor="middle" fill="#24292F" font-size="10">Recipient Signs Digitally</text>
  <text x="180" y="582" text-anchor="middle" fill="#24292F" font-size="10">Return Signed PDF → Blob</text>
  <!-- Bidirectional arrow -->
  <path d="M 180 450 L 180 500" stroke="#EC1C24" stroke-width="1.5" fill="none" marker-end="url(#arrowGray)"/>

  <!-- Azure SQL -->
  <g transform="translate(360, 500)">
    <rect width="340" height="110" rx="10" fill="url(#azureGrad)" stroke="#0078D4" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="340" height="30" rx="10" fill="#0078D4"/>
    <rect x="0" y="20" width="340" height="10" fill="#0078D4"/>
    <text x="170" y="20" text-anchor="middle" fill="white" font-size="12" font-weight="600">☁️ Azure SQL Database</text>
    <text x="170" y="50" text-anchor="middle" fill="#24292F" font-size="10" font-weight="600">Transactional Data Store</text>
    <text x="85" y="68" text-anchor="middle" fill="#6B7280" font-size="10">📋 devices</text>
    <text x="255" y="68" text-anchor="middle" fill="#6B7280" font-size="10">👤 cat_user</text>
    <text x="85" y="84" text-anchor="middle" fill="#6B7280" font-size="10">🔗 assignments</text>
    <text x="255" y="84" text-anchor="middle" fill="#6B7280" font-size="10">🚨 incidents</text>
    <text x="170" y="100" text-anchor="middle" fill="#6B7280" font-size="10">📄 documents · 📝 audit_log</text>
  </g>

  <!-- Azure Blob Storage -->
  <rect x="740" y="500" width="320" height="110" rx="10" fill="url(#azureGrad)" stroke="#0089D6" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="740" y="500" width="320" height="30" rx="10" fill="#0089D6"/>
  <rect x="740" y="520" width="320" height="10" fill="#0089D6"/>
  <text x="900" y="520" text-anchor="middle" fill="white" font-size="12" font-weight="600">☁️ Azure Blob Storage</text>
  <text x="900" y="550" text-anchor="middle" fill="#24292F" font-size="10" font-weight="600">Document Repository</text>
  <text x="900" y="568" text-anchor="middle" fill="#6B7280" font-size="10">📄 Signed Responsibility Letters</text>
  <text x="900" y="584" text-anchor="middle" fill="#6B7280" font-size="10">📷 Incident Evidence Files</text>
  <text x="900" y="600" text-anchor="middle" fill="#6B7280" font-size="10">🔒 RBAC · Encrypted at Rest</text>

  <!-- Arrow from Azure SQL to Power BI -->
  <line x1="530" y1="610" x2="530" y2="660" stroke="#F2C811" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <rect x="498" y="628" width="80" height="18" rx="9" fill="#F2C811"/>
  <text x="538" y="641" text-anchor="middle" fill="#24292F" font-size="9" font-weight="600">DirectQuery</text>

  <!-- ===== LAYER 5: POWER BI ===== -->
  <rect x="280" y="670" width="540" height="120" rx="10" fill="white" stroke="#F2C811" stroke-width="2" filter="url(#shadow)"/>
  <rect x="280" y="670" width="540" height="30" rx="10" fill="#F2C811"/>
  <rect x="280" y="690" width="540" height="10" fill="#F2C811"/>
  <text x="550" y="690" text-anchor="middle" fill="#24292F" font-size="12" font-weight="700">📊 Microsoft Power BI — Executive Dashboard</text>

  <g transform="translate(300, 710)">
    <rect width="120" height="36" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
    <text x="60" y="16" text-anchor="middle" fill="#92400E" font-size="9" font-weight="600">🗺️ Device Map</text>
    <text x="60" y="30" text-anchor="middle" fill="#92400E" font-size="8">National Coverage</text>
  </g>
  <g transform="translate(430, 710)">
    <rect width="120" height="36" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
    <text x="60" y="16" text-anchor="middle" fill="#92400E" font-size="9" font-weight="600">📈 Inventory KPIs</text>
    <text x="60" y="30" text-anchor="middle" fill="#92400E" font-size="8">Stock · Assigned</text>
  </g>
  <g transform="translate(560, 710)">
    <rect width="120" height="36" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
    <text x="60" y="16" text-anchor="middle" fill="#92400E" font-size="9" font-weight="600">🚨 Incidents</text>
    <text x="60" y="30" text-anchor="middle" fill="#92400E" font-size="8">Trends · Hotspots</text>
  </g>
  <g transform="translate(690, 710)">
    <rect width="110" height="36" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
    <text x="55" y="16" text-anchor="middle" fill="#92400E" font-size="9" font-weight="600">✅ Compliance</text>
    <text x="55" y="30" text-anchor="middle" fill="#92400E" font-size="8">Audit Score</text>
  </g>

  <text x="550" y="778" text-anchor="middle" fill="#9CA3AF" font-size="9">Real-time dashboards · DirectQuery to Azure SQL · No data duplication</text>

  <!-- Azure AD badge -->
  <rect x="40" y="670" width="200" height="50" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="140" y="692" text-anchor="middle" fill="#374151" font-size="10" font-weight="600">🔐 Azure Active Directory</text>
  <text x="140" y="708" text-anchor="middle" fill="#6B7280" font-size="9">SSO · RBAC · MFA</text>

  <!-- Footer -->
  <text x="550" y="808" text-anchor="middle" fill="#9CA3AF" font-size="10">GSK × R&amp;R Consulting IT — Enterprise Architecture Case Study — Portfolio Documentation</text>
</svg>
